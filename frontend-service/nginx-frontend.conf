server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /auth {
        proxy_pass http://api-gateway:80;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_http_version 1.1;
    }

    location /api {
        proxy_pass http://api-gateway:80;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}